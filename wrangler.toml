name = "gbretail-backend"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
PORT = "8787"
CORS_ORIGIN = "http://localhost:3000,http://localhost:3001"
USE_NEON = "1"
NODE_ENV = "production"
WORKER = "1"

# CORS_ORIGIN — set to your production frontend URLs via `wrangler var put CORS_ORIGIN`
# e.g. "https://shop1.yourdomain.com,https://shop2.yourdomain.com,https://online.yourdomain.com"

# Secrets (set via `wrangler secret put DATABASE_URL`)
# DATABASE_URL = "postgresql://..."
# JWT_ACCESS_SECRET = "..."  (via `wrangler secret put JWT_ACCESS_SECRET`)
# JWT_REFRESH_SECRET = "..." (via `wrangler secret put JWT_REFRESH_SECRET`)

[observability]
enabled = true
